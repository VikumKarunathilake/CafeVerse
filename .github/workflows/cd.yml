name: CafeVerse Multiplatform CD Pipeline

on:
  push:
    branches:
      - main
      - master
      - flutter
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - flutter
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create GitHub Release (true/false)"
        required: false
        default: "false"
        type: boolean
      build_android:
        description: "Build Android APK & AAB"
        required: false
        default: "true"
        type: boolean
      build_ios:
        description: "Build iOS IPA"
        required: false
        default: "true"
        type: boolean
      build_windows:
        description: "Build Windows EXE (ZIP)"
        required: false
        default: "true"
        type: boolean

permissions:
  contents: write
  packages: write

jobs:
  # --------------------------------------------------------------------------
  # Step 1: Quality Checks & Unit Testing
  # --------------------------------------------------------------------------
  lint_and_test:
    name: Lint & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze code
        run: flutter analyze

      - name: Run tests
        run: flutter test

  # --------------------------------------------------------------------------
  # Step 2: Android Build (APK & AAB)
  # --------------------------------------------------------------------------
  build_android:
    name: Build Android (APK & AAB)
    needs: [lint_and_test]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_android != false))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Configure Keystore (if secrets provided)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" >> android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties

      - name: Build Universal Release APK
        run: flutter build apk --release

      - name: Build Split-per-ABI APKs
        run: flutter build apk --release --split-per-abi

      - name: Build Android App Bundle (AAB)
        run: flutter build appbundle --release

      - name: Stage Android Artifacts
        run: |
          mkdir -p android-artifacts
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp build/app/outputs/flutter-apk/app-release.apk android-artifacts/cafeverse-universal-release.apk
          fi
          if [ -d "build/app/outputs/flutter-apk" ]; then
            for f in build/app/outputs/flutter-apk/app-*-release.apk; do
              [ -f "$f" ] && cp "$f" android-artifacts/
            done
          fi
          if [ -f "build/app/outputs/bundle/release/app-release.aab" ]; then
            cp build/app/outputs/bundle/release/app-release.aab android-artifacts/cafeverse-release.aab
          fi
          ls -lah android-artifacts/

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cafeverse-android
          path: android-artifacts/*
          retention-days: 30

  # --------------------------------------------------------------------------
  # Step 3: iOS Build (IPA)
  # --------------------------------------------------------------------------
  build_ios:
    name: Build iOS (IPA)
    needs: [lint_and_test]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_ios != false))
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Disable Swift Package Manager
        run: flutter config --no-enable-swift-package-manager
        
      - name: Build iOS Application (.app)
        run: flutter build ios --release --no-codesign

      - name: Package iOS App into IPA
        run: |
          mkdir -p ios-artifacts/Payload
          cp -r build/ios/iphoneos/Runner.app ios-artifacts/Payload/
          cd ios-artifacts
          zip -r cafeverse-ios.ipa Payload
          rm -rf Payload
          ls -lah

      - name: Upload iOS IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafeverse-ios
          path: ios-artifacts/cafeverse-ios.ipa
          retention-days: 30

  # --------------------------------------------------------------------------
  # Step 4: Windows Build (EXE & Assets ZIP)
  # --------------------------------------------------------------------------
  build_windows:
    name: Build Windows (EXE)
    needs: [lint_and_test]
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.build_windows != false))
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Enable Windows Desktop Support
        run: flutter config --enable-windows-desktop

      - name: Install dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Binary and Dependencies
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path windows-artifacts
          Compress-Archive -Path "build\windows\x64\runner\Release\*" -DestinationPath "windows-artifacts\cafeverse-windows-x64.zip"
          Get-ChildItem windows-artifacts

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: cafeverse-windows
          path: windows-artifacts/cafeverse-windows-x64.zip
          retention-days: 30

  # --------------------------------------------------------------------------
  # Step 5: Unified GitHub Release (APK, IPA, EXE/ZIP, AAB)
  # --------------------------------------------------------------------------
  publish_release:
    name: Publish GitHub Release
    needs: [build_android, build_ios, build_windows]
    if: always() && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.create_release == true))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all build artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-binaries

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" =~ ^refs/tags/ ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
          else
            TAG_NAME="v$(date +'%Y.%m.%d-%H%M%S')"
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Release Tag: $TAG_NAME"

      - name: Consolidate Binaries
        run: |
          mkdir -p release-dist
          find release-binaries/ -type f \( -name "*.apk" -o -name "*.aab" -o -name "*.ipa" -o -name "*.zip" \) -exec cp {} release-dist/ \;
          echo "Files to publish in Release:"
          ls -lah release-dist/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag_name }}
          name: "CafeVerse ${{ steps.release_info.outputs.tag_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
